<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Siya Personal Assistant Platform - Web Interface">
    <title>SIYA - Personal Assistant</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-logo">
            <!-- Mobile menu toggle -->
            <button class="btn btn-sm mobile-menu-btn" id="mobile-menu-btn" onclick="toggleMobileSidebar()">☰</button>
            <h1>SIYA</h1>
            <span class="header-subtitle">Personal Assistant Platform</span>
        </div>
        <div class="header-actions">
            <!-- Desktop only notifications button -->
            <button class="btn btn-sm desktop-only" id="notifications-btn" style="position: relative;">
                🔔 Notifications
                <span class="pill pill-error" id="notification-badge"
                    style="position: absolute; top: -8px; right: -8px; display: none;">0</span>
            </button>
        </div>
    </header>

    <!-- Mobile sidebar overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleMobileSidebar()"></div>

    <!-- ===== MAIN LAYOUT ===== -->
    <main class="main-layout">
        <!-- Sidebar: Tool Browser -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <input type="text" class="input sidebar-search" id="tool-search" placeholder="🔍 Search tools...">
            </div>
            <div class="sidebar-content" id="tool-groups">
                <!-- Tool groups rendered by JS -->
                <div style="padding: var(--space-lg); text-align: center; color: var(--text-muted);">
                    <span class="loading"></span>
                    <p style="margin-top: var(--space-md)">Loading tools...</p>
                </div>
            </div>
            <!-- Mobile-only notifications in sidebar (collapsible) -->
            <div class="sidebar-notifications mobile-only" id="sidebar-notifications">
                <div class="sidebar-section-header" onclick="toggleMobileNotifications()">
                    🔔 Notifications
                    <span class="pill pill-error" id="mobile-notification-badge" style="display: none;">0</span>
                    <span class="notification-toggle" id="notification-toggle">▼</span>
                </div>
                <div class="notifications-list-mobile collapsed" id="mobile-notifications-list">
                    <!-- Rendered by JS -->
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <section class="main-content">
            <!-- Empty State -->
            <div class="empty-state" id="empty-state">
                <div class="empty-state-icon">🛠️</div>
                <h2>Select a Tool</h2>
                <p style="margin-top: var(--space-sm); max-width: 300px;">
                    Choose a tool from the sidebar to view its parameters and execute it.
                </p>
            </div>

            <!-- Tool Panel (hidden initially) -->
            <div class="tool-panel" id="tool-panel" style="display: none;">
                <!-- Rendered by JS -->
            </div>
        </section>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div class="footer-status">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Connecting...</span>
        </div>
        <div>
            <span style="color: var(--text-muted);">MCP HTTP @ port 8080 • Web UI @ port 3000</span>
        </div>
    </footer>

    <!-- ===== CONFIRMATION MODAL ===== -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header" id="modal-title">
                Confirm Action
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Content rendered by JS -->
            </div>
            <div class="modal-footer">
                <button class="btn" id="modal-cancel" onclick="cancelConfirmation()">Cancel</button>
                <button class="btn btn-success" id="modal-confirm" onclick="confirmExecution()">Yes, Execute</button>
            </div>
        </div>
    </div>

    <!-- ===== NOTIFICATIONS PANEL ===== -->
    <aside class="notifications-panel" id="notifications-panel">
        <div class="notifications-header">
            <strong>Notifications</strong>
            <button class="btn btn-sm" id="close-notifications" onclick="toggleNotifications()">✕</button>
        </div>
        <div class="notifications-list" id="notifications-list">
            <!-- Rendered by JS -->
        </div>
    </aside>

    <!-- Scripts -->
    <script src="/app.js"></script>
</body>

</html>
